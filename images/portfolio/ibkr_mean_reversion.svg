<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">IBKR mean-reversion research prototype workflow</title>
  <desc id="description">Historical IBKR data flows through quality checks, an Ornstein–Uhlenbeck model, and signal analysis to produce reviewable research output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="0.55" stop-color="#edf6fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#0e7490" stroke-opacity=".07"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0e7490"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f2334" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="url(#background)"/>
  <rect width="1400" height="820" fill="url(#grid)"/>
  <circle cx="1300" cy="80" r="250" fill="#0e7490" opacity=".07"/>
  <circle cx="90" cy="760" r="230" fill="#047857" opacity=".05"/>

  <text x="80" y="86" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3">QUANT ENGINEERING / EVIDENCE-BOUNDED WORKFLOW</text>
  <text x="80" y="154" fill="#1f2937" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">IBKR Mean-Reversion Research Prototype</text>
  <text x="80" y="198" fill="#52606d" font-family="Arial, Helvetica, sans-serif" font-size="23">Team research prototype • Public code evidence • No live-performance claim</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(80 292)">
      <rect width="220" height="154" rx="16" fill="#ffffff" stroke="#0e7490" stroke-opacity=".24"/>
      <circle cx="38" cy="42" r="14" fill="#0e7490"/>
      <text x="66" y="49" fill="#1f2937" font-size="20" font-weight="700">Historical data</text>
      <text x="28" y="94" fill="#52606d" font-size="17">SPY historical bars</text>
      <text x="28" y="122" fill="#52606d" font-size="17">Research input only</text>
    </g>

    <g transform="translate(340 292)">
      <rect width="220" height="154" rx="16" fill="#ffffff" stroke="#0e7490" stroke-opacity=".24"/>
      <circle cx="38" cy="42" r="14" fill="#0e7490"/>
      <text x="66" y="49" fill="#1f2937" font-size="20" font-weight="700">Data checks</text>
      <text x="28" y="94" fill="#52606d" font-size="17">Missing data</text>
      <text x="28" y="122" fill="#52606d" font-size="17">Variance and sample checks</text>
    </g>

    <g transform="translate(600 292)">
      <rect width="240" height="154" rx="16" fill="#ffffff" stroke="#0e7490" stroke-opacity=".24"/>
      <circle cx="38" cy="42" r="14" fill="#0e7490"/>
      <text x="66" y="49" fill="#1f2937" font-size="20" font-weight="700">OU model</text>
      <text x="28" y="94" fill="#52606d" font-size="17">Theta estimation</text>
      <text x="28" y="122" fill="#52606d" font-size="17">Mean-reversion reference</text>
    </g>

    <g transform="translate(880 292)">
      <rect width="200" height="154" rx="16" fill="#ffffff" stroke="#0e7490" stroke-opacity=".24"/>
      <circle cx="38" cy="42" r="14" fill="#0e7490"/>
      <text x="66" y="49" fill="#1f2937" font-size="20" font-weight="700">Signal analysis</text>
      <text x="28" y="94" fill="#52606d" font-size="17">Price comparison</text>
      <text x="28" y="122" fill="#52606d" font-size="17">Research signal</text>
    </g>

    <g transform="translate(1120 292)">
      <rect width="200" height="154" rx="16" fill="#ffffff" stroke="#0e7490" stroke-opacity=".24"/>
      <circle cx="38" cy="42" r="14" fill="#047857"/>
      <text x="66" y="49" fill="#1f2937" font-size="20" font-weight="700">Reviewable output</text>
      <text x="28" y="94" fill="#52606d" font-size="17">Assumptions visible</text>
      <text x="28" y="122" fill="#52606d" font-size="17">Human interpretation</text>
    </g>
  </g>

  <g fill="none" stroke="#0e7490" stroke-width="4" marker-end="url(#arrow)">
    <path d="M304 369H328"/>
    <path d="M564 369H588"/>
    <path d="M844 369H868"/>
    <path d="M1084 369H1108"/>
  </g>

  <g transform="translate(80 536)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1240" height="174" rx="18" fill="#0b1726"/>
    <text x="34" y="48" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="2">EVIDENCE BOUNDARY</text>
    <text x="34" y="91" fill="#ffffff" font-size="24" font-weight="700">Research code demonstrates model logic and IBKR connectivity.</text>
    <text x="34" y="125" fill="#ffffff" font-size="21">No profitability or production-deployment claim.</text>
    <text x="34" y="155" fill="#c7d3df" font-size="18">Tony's public contribution: OU logic • theta estimation • signal calculations • equity adaptation • documentation</text>
  </g>
</svg>
