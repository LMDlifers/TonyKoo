  <text x="72" y="420" fill="#52606d" font-family="Arial, Helvetica, sans-serif"
        font-size="24">Measurable results • Reviewable boundaries</text>
  <rect x="72" y="488" width="206" height="6" rx="3" fill="#0e7490"/>

  <g transform="translate(760 112)">
    <rect width="360" height="402" rx="20" fill="#ffffff" fill-opacity=".84"
