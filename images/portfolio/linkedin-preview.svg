    <path d="M92 94L264 190L110 300M92 94L110 300M264 190L286 88"
          fill="none" stroke="#0e7490" stroke-width="3" stroke-opacity=".42"/>
    <g fill="#0e7490" filter="url(#glow)">
      <circle cx="92" cy="94" r="10"/>
      <circle cx="264" cy="190" r="10"/>
      <circle cx="110" cy="300" r="10"/>
      <circle cx="286" cy="88" r="10"/>
    </g>
    <text x="32" y="354" fill="#1f2937" font-family="Arial, Helvetica, sans-serif"
