  <text class="tiny" x="405" y="630">state 1</text>
  <rect class="dash" x="640" y="572" width="142" height="98" rx="4"/>
  <rect class="nodeGreen" x="654" y="586" width="116" height="44" rx="3"/>
  <text class="tiny" x="684" y="614">Hidden</text>
  <text class="tiny" x="685" y="630">state 2</text>
  <rect class="dash" x="940" y="572" width="142" height="98" rx="4"/>
  <rect class="nodeGreen" x="954" y="586" width="116" height="44" rx="3"/>
  <text class="tiny" x="984" y="614">Hidden</text>
  <text class="tiny" x="985" y="630">state n</text>

  <path class="arrowGreen" d="M 1114 690 L 1114 794"/>
  <text class="noteGreen" x="1142" y="724">Word Encoder</text>
  <text class="noteGreen" x="1142" y="744">128-dim per token</text>
  <text class="noteGreen" x="1142" y="762">BiLSTM attention</text>
  <text class="note" x="1142" y="795">Aggregates words before</text>
  <text class="note" x="1142" y="813">sentence-level modelling</text>

  <text class="tiny" x="510" y="462">Backward pass</text>
  <path class="arrow" d="M 500 458 L 452 458"/>
  <text class="tiny" x="510" y="505">Forward pass</text>
  <path class="arrow" d="M 452 502 L 500 502"/>
  <text class="tiny" x="510" y="626">Backward pass</text>
  <path class="arrow" d="M 500 622 L 452 622"/>
  <text class="tiny" x="510" y="656">Forward pass</text>
  <path class="arrow" d="M 452 652 L 500 652"/>

  <rect class="nodeWhite" x="248" y="802" width="116" height="28" rx="2"/>
  <text class="tiny" x="274" y="821">Tokenisation</text>
  <rect class="nodeWhite" x="384" y="802" width="716" height="28" rx="2"/>
  <text class="tiny" x="708" y="821">Tokenisation</text>

  <rect class="nodeCream" x="250" y="846" width="116" height="42" rx="3"/>
  <text class="tiny" x="274" y="864">Combined Facts</text>
  <text class="tiny" x="296" y="881">(LLD)</text>
  <rect class="nodePink" x="520" y="846" width="116" height="42" rx="3"/>
  <text class="tiny" x="546" y="864">Combined Issue</text>
