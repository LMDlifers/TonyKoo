  <text class="tiny" x="985" y="538">Hidden</text>
  <text class="tiny" x="984" y="554">state n</text>

  <rect class="dashRed" x="236" y="590" width="278" height="76" rx="4"/>
  <rect class="nodePurple" x="260" y="604" width="98" height="48" rx="3"/>
  <text class="tiny" x="286" y="628">Fact Type</text>
  <text class="tiny" x="284" y="644">Embedding 1</text>
  <rect class="nodeBlue" x="374" y="604" width="116" height="48" rx="3"/>
  <text class="tiny" x="404" y="634">Sentence 1</text>

  <rect class="nodeBlue" x="656" y="604" width="116" height="48" rx="3"/>
  <text class="tiny" x="686" y="634">Sentence 2</text>
  <rect class="nodeBlue" x="956" y="604" width="116" height="48" rx="3"/>
  <text class="tiny" x="986" y="634">Sentence n</text>

  <path class="arrowBlue" d="M 1114 424 L 1114 648"/>
  <text class="noteBlue" x="1142" y="510">Sentence Encoder</text>
  <text class="noteBlue" x="1142" y="530">128-dim per token</text>
  <path class="mutedLine" d="M 1084 603 C 1128 603 1128 653 1084 653"/>
  <text class="noteRed" x="1138" y="631">Management of</text>
  <text class="noteRed" x="1138" y="648">sentence-level context</text>

  <text class="noteRed" x="64" y="612">Connect only to its</text>
  <text class="noteRed" x="64" y="630">respective fact type</text>
  <text class="noteRed" x="64" y="648">and append sentence</text>
  <text class="noteRed" x="64" y="666">embedding for support</text>

  <rect class="dash" x="360" y="692" width="740" height="78" rx="4"/>
  <rect class="nodeViolet" x="248" y="704" width="112" height="58" rx="3"/>
