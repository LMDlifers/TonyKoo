  <text class="whiteText" x="278" y="748">Fact Date</text>
  <rect class="nodeGreen" x="380" y="710" width="116" height="44" rx="3"/>
  <text class="tiny" x="405" y="738">Word_1<tspan baseline-shift="sub" font-size="9">sen2</tspan></text>
  <rect class="nodeGreen" x="654" y="710" width="116" height="44" rx="3"/>
  <text class="tiny" x="680" y="738">Word_2<tspan baseline-shift="sub" font-size="9">sen2</tspan></text>
  <rect class="nodeGreen" x="956" y="710" width="116" height="44" rx="3"/>
  <text class="tiny" x="980" y="738">Word_n<tspan baseline-shift="sub" font-size="9">sen2</tspan></text>

