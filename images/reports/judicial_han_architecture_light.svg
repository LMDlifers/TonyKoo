  <text class="tiny" x="685" y="538">Hidden</text>
  <text class="tiny" x="684" y="554">state 2</text>

  <rect class="dash" x="940" y="416" width="142" height="150" rx="4"/>
  <rect class="nodeBlue" x="955" y="438" width="112" height="52" rx="3"/>
  <text class="tiny" x="985" y="468">Hidden</text>
  <text class="tiny" x="984" y="484">state n</text>
