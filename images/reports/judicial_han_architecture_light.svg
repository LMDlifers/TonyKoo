<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Light-background HAN architecture diagram</title>
  <desc id="desc">Hierarchical attention network architecture showing document, sentence, word, court, and judge feature streams joined through late fusion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40566f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6ccf"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#208457"/>
    </marker>
    <style>
      .canvas { fill: #fbfbf7; }
      .panel { fill: #ffffff; stroke: #d8e1ea; stroke-width: 1.5; }
      .laneBlue { fill: #edf5ff; stroke: #b9d4f7; stroke-width: 1.5; }
      .laneGreen { fill: #effaf2; stroke: #b8e1c2; stroke-width: 1.5; }
      .laneWarm { fill: #fff8df; stroke: #e8d997; stroke-width: 1.5; }
      .nodeWhite { fill: #ffffff; stroke: #aebdcb; stroke-width: 1.5; }
      .nodeCream { fill: #fff9cd; stroke: #d8c96f; stroke-width: 1.5; }
      .nodeBlue { fill: #a9cff5; stroke: #4d91d3; stroke-width: 1.5; }
      .nodeGreen { fill: #b8f3bd; stroke: #48a65a; stroke-width: 1.5; }
      .nodePurple { fill: #eee6ff; stroke: #9b79dc; stroke-width: 1.5; }
      .nodePink { fill: #ffe6e6; stroke: #d67171; stroke-width: 1.5; }
      .nodeViolet { fill: #7048ff; stroke: #4c2ed5; stroke-width: 1.5; }
      .nodeOutput { fill: #73bf32; stroke: #4d8f1d; stroke-width: 1.5; }
      .dash { fill: none; stroke: #6d7c8c; stroke-width: 2; stroke-dasharray: 8 6; }
      .dashRed { fill: none; stroke: #e23232; stroke-width: 4; stroke-dasharray: 8 6; }
      .arrow { stroke: #40566f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #2d6ccf; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #208457; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .line { stroke: #40566f; stroke-width: 2; fill: none; }
      .mutedLine { stroke: #9aaabc; stroke-width: 1.5; fill: none; }
      .label { fill: #1f3145; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .small { fill: #27384a; font-family: Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .tiny { fill: #42566c; font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .note { fill: #42566c; font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .noteRed { fill: #cf3030; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .noteBlue { fill: #2d6ccf; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .noteGreen { fill: #208457; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .whiteText { fill: #ffffff; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="900"/>
  <rect class="panel" x="32" y="28" width="1216" height="860" rx="18"/>
  <text class="label" x="54" y="68">Hierarchical Attention Network - Judicial Liability Classification</text>
  <text class="note" x="54" y="94">Light-background recreation for portfolio readability; based on the original report architecture figure.</text>

  <rect class="nodeOutput" x="574" y="62" width="142" height="58" rx="4"/>
  <text class="whiteText" x="606" y="87">Defendant</text>
  <text class="whiteText" x="608" y="106">liable (1/0)</text>

  <rect class="nodePurple" x="566" y="145" width="158" height="58" rx="4"/>
  <text class="small" x="582" y="166">MLP + Dropout</text>
  <text class="tiny" x="586" y="184">label smoothing,</text>
  <text class="tiny" x="592" y="198">SwiGLU, linear</text>

  <rect class="nodeWhite" x="587" y="235" width="116" height="52" rx="4"/>
  <text class="small" x="611" y="266">Late Fusion</text>

  <path class="arrow" d="M 645 235 L 645 205"/>
  <path class="arrow" d="M 645 145 L 645 120"/>

