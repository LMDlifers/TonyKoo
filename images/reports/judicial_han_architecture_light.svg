  <text class="tiny" x="722" y="350">Combined</text>
  <text class="tiny" x="719" y="368">Rule Vector</text>
  <text class="tiny" x="734" y="383">(1x128)</text>

  <rect class="nodeCream" x="860" y="326" width="116" height="62" rx="4"/>
  <text class="tiny" x="889" y="350">Tribunal</text>
  <text class="tiny" x="902" y="368">Court</text>
  <text class="tiny" x="896" y="383">(1x16)</text>

  <rect class="nodeCream" x="1014" y="326" width="118" height="62" rx="4"/>
  <text class="tiny" x="1055" y="350">Judge</text>
  <text class="tiny" x="1052" y="368">Vector</text>
  <text class="tiny" x="1051" y="383">(1x16)</text>

