<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Choose the level of agent search</title><desc id="desc">A direct baseline can branch into whole answer sampling, intermediate thought search, action tree search, heterogeneous agent search, or search over revised agent harnesses.</desc>
<rect width="1200" height="490" rx="28" fill="#f7fafc"/>
<text x="54" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1f3145">What is the search actually changing?</text>
<g font-family="Arial,sans-serif" fill="#1f3145">
<rect x="55" y="113" width="220" height="110" rx="18" fill="#dfeaf6" stroke="#a8c4de" stroke-width="2"/><text x="83" y="157" font-size="22" font-weight="700">Direct baseline</text><text x="83" y="188" font-size="17">One answer, one check</text>
<rect x="345" y="95" width="355" height="144" rx="18" fill="#edf8f5" stroke="#afd6c9" stroke-width="2"/><text x="375" y="137" font-size="22" font-weight="700">Answers or thoughts</text><text x="375" y="170" font-size="17">Best of N: whole answers</text><text x="375" y="200" font-size="17">Tree of Thoughts: partial states</text>
<rect x="770" y="95" width="375" height="144" rx="18" fill="#fff4e8" stroke="#e5caa7" stroke-width="2"/><text x="800" y="137" font-size="22" font-weight="700">Actions in a task</text><text x="800" y="170" font-size="17">MCTS: branch, score, revisit</text><text x="800" y="200" font-size="17">SYMPHONY: diverse model pool</text>
<rect x="345" y="291" width="800" height="116" rx="18" fill="#f1ecfa" stroke="#c9b9e4" stroke-width="2"/><text x="375" y="336" font-size="22" font-weight="700">Agent design itself</text><text x="375" y="371" font-size="17">SIFT compares revised coding-agent harnesses; executed tasks validate the final design.</text>
</g><path d="M275 169h67m354 0h71M167 223v126h175" fill="none" stroke="#6082a6" stroke-width="4" marker-end="url(#a)"/>
<text x="55" y="459" font-family="Arial,sans-serif" font-size="17" fill="#526b82">Increase search only when intermediate feedback is useful and validated success justifies the cost.</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="#6082a6"/></marker></defs>
</svg>
