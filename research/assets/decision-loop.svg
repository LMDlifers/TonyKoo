<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">How to decide under uncertainty</title><desc id="desc">A decision loop moves from base rates and evidence to a reversible choice, observed outcome and updated belief.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#315986"/></marker></defs><rect width="1200" height="500" rx="30" fill="#edf4fa"/><text x="34" y="70" font-family="Arial,sans-serif" font-weight="700" font-size="35" fill="#203247">DECISIONS AND MONEY</text><g font-family="Arial,sans-serif"><rect x="30" y="126" width="265" height="232" rx="25" fill="white" stroke="#2c6696" stroke-width="4"/><circle cx="75" cy="172" r="24" fill="#2c6696"/><text x="75" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="white">01</text><text x="54" y="250" font-size="42" font-weight="700" fill="#203247">Base rate</text><text x="54" y="303" font-size="28" fill="#40546b">Start outside-in</text><path d="M296 242 H318" stroke="#315986" stroke-width="5" marker-end="url(#arrow)"/><rect x="325" y="126" width="265" height="232" rx="25" fill="white" stroke="#6d56a1" stroke-width="4"/><circle cx="370" cy="172" r="24" fill="#6d56a1"/><text x="370" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="white">02</text><text x="349" y="250" font-size="42" font-weight="700" fill="#203247">Evidence</text><text x="349" y="303" font-size="28" fill="#40546b">Update belief</text><path d="M591 242 H613" stroke="#315986" stroke-width="5" marker-end="url(#arrow)"/><rect x="620" y="126" width="265" height="232" rx="25" fill="white" stroke="#9c6330" stroke-width="4"/><circle cx="665" cy="172" r="24" fill="#9c6330"/><text x="665" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="white">03</text><text x="644" y="250" font-size="42" font-weight="700" fill="#203247">Choice</text><text x="644" y="303" font-size="28" fill="#40546b">Limit downside</text><path d="M886 242 H908" stroke="#315986" stroke-width="5" marker-end="url(#arrow)"/><rect x="915" y="126" width="265" height="232" rx="25" fill="white" stroke="#237963" stroke-width="4"/><circle cx="960" cy="172" r="24" fill="#237963"/><text x="960" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="white">04</text><text x="939" y="250" font-size="42" font-weight="700" fill="#203247">Review</text><text x="939" y="303" font-size="28" fill="#40546b">Learn outcome</text></g><text x="34" y="435" font-family="Arial,sans-serif" font-size="26" fill="#315986">A decision path, not a performance claim</text></svg>